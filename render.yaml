services:
  - type: web
    name: alliance-portal-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Postgres bağlantısı (ör. Supabase → Connect → Session pooler, port 5432)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Frontend adres(ler)i, virgülle: https://alliance-portal.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      # İlk açılışta bu e-postayla admin hesabı yoksa oluşturulur
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Divizyon Admin
